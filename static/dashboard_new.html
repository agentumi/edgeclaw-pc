<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdgeClaw Dashboard v2.3</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="dashboard.css">
    
    
</head>
<body>

<div class="app-container">
    
    <!-- P4-1-6 Left Panel (Sidebar) -->
    <aside class="sidebar">
        <div class="sidebar-header logo-section" data-target="view-dashboard">
            <i class="fa-solid fa-cube"></i>
            <h1>EdgeClaw</h1>
        </div>
        
        <div class="sidebar-nav">
            <div class="nav-item active" data-target="view-dashboard">
                <i class="fa-solid fa-chart-pie"></i> Mission Control
            </div>
            <div class="nav-item" data-target="view-board">
                <i class="fa-solid fa-kanban"></i> Agent Board
            </div>
            <div class="nav-item" data-target="view-memory">
                <i class="fa-solid fa-brain"></i> Memory Explorer
            </div>
            <div class="nav-item" data-target="view-market">
                <i class="fa-solid fa-store"></i> Marketplace
            </div>
            <div class="nav-item" data-target="view-automations">
                <i class="fa-solid fa-robot"></i> Automations
            </div>
            <div class="nav-item" data-target="view-extensions">
                <i class="fa-solid fa-layer-group"></i> Extensions
            </div>
        </div>
        
        <div class="device-groups">
            <div class="group-title">
                <span id="sidebarGroupTitle">Teams & Groups</span>
                <i class="fa-solid fa-users-gear" style="cursor:pointer" title="Manage Teams" onclick="setActiveView('view-fleet')"></i>
            </div>
            <div id="sidebarTeamGroups" class="team-accordion">
                <!-- Populated by V2.3 Group API -->
                <div class="team-item">
                    <div class="team-header">
                        <div class="team-name">
                            <i class="fa-solid fa-hashtag" style="color:var(--primary-400)"></i>
                            <span>Loading Teams...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="sidebar-nav" style="border-top: 1px solid var(--surface-700); margin-top: auto;">
            <div class="nav-item" data-target="view-aichat">
                <i class="fa-solid fa-message"></i> AI Chat
            </div>
            <div class="nav-item" data-target="view-chat">
                <i class="fa-solid fa-terminal"></i> Command Center
            </div>
            <div class="nav-item" data-target="view-settings">
                <i class="fa-solid fa-gear"></i> Settings v2.3
            </div>
        <div class="sidebar-footer" style="padding:16px; border-top:1px solid var(--surface-700); margin-top:auto;">
            <button class="btn" style="width:100%; border-radius:10px; justify-content:center;" onclick="showAddAgentModal()"><i class="fa-solid fa-plus-circle"></i> Add Agent</button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
        <header class="topbar">
            <div style="display:flex; align-items:center; gap:20px;">
                <div id="mode-indicator" onclick="toggleMode()" class="mode-sanctum" style="display:flex; align-items:center; gap:10px; padding:6px 14px; border-radius:30px; border:1px solid var(--surface-700); background:rgba(0,0,0,0.2); transition:var(--transition); cursor:pointer;">
                    <i id="mode-icon" class="fa-solid fa-shield-halved" style="color:var(--primary-400);"></i>
                    <span id="mode-text" style="font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--primary-400);">Sanctum Mode</span>
                    <div style="width:6px; height:6px; border-radius:50%; background:var(--primary-500); box-shadow:0 0-10px var(--primary-500); animation: pulse 2s infinite;"></div>
                </div>
                <div id="view-breadcrumb" class="breadcrumb">Mission Control</div>
                
                <div class="search-bar" style="background:var(--surface-800); padding:8px 16px; border-radius:20px; border:1px solid var(--surface-700); width: 300px; display:flex; align-items:center; gap:8px;">
                    <i class="fa-solid fa-magnifying-glass" style="color:var(--text-muted)"></i>
                    <input type="text" placeholder="Search memories, tasks, agents..." style="background:transparent; border:none; outline:none; color:var(--text-primary); width:100%; font-family:var(--font-sans)">
                </div>
            </div>
            
            <div style="display:flex; align-items:center; gap: 16px;">
                <span class="badge badge-green"><i class="fa-solid fa-shield-halved"></i> Zero-Trust Active</span>
                <span id="topbarActiveAgents" class="badge badge-blue"><i class="fa-solid fa-server"></i> 1 Agent Active</span>
                <span id="balance-display" style="font-family:var(--font-mono); color:var(--accent-gold); font-weight:600;"><i class="fa-solid fa-microchip"></i> Loading...</span>
                <div style="width:32px; height:32px; background:var(--primary-glow); border:1px solid var(--primary-500); border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--primary-400); font-size:12px; font-weight:700;">KS</div>
            </div>
        </header>

        <!-- VIEW 1: Mission Control -->
        <div id="view-dashboard" class="view-content active"></div>
        <!-- VIEW 1.5: AI Chat -->
        <div id="view-aichat" class="view-content" ></div>
        <!-- VIEW 2: Command Center (Integrated Chat) -->
        <div id="view-chat" class="view-content" ></div>
        <!-- VIEW 2.5: Fleet Orchestration (V2.3) -->
        <div id="view-fleet" class="view-content" ></div>
        <!-- VIEW 3: Agent Board (P4-1-3) -->
        <div id="view-board" class="view-content" ></div>
        <!-- VIEW 3: Memory Explorer (P4-1-4) -->
        <div id="view-memory" class="view-content" ></div>
        <!-- VIEW 4: Agent Marketplace (P4-1-5) -->
        <div id="view-market" class="view-content" ></div>
        <!-- VIEW 5: Automations (Templates) -->
        <div id="view-automations" class="view-content" ></div>
        <!-- VIEW 6: Extensions -->
        <div id="view-extensions" class="view-content" ></div>
        <!-- VIEW 7: Settings -->
        <div id="view-settings" class="view-content" ></div>
    </main>

    <!-- Modals & Context Panels (Sibling of Sidebar and Main for Flex Layout) -->
    <div id="modal-container"></div>

    <script type="module" src="js/dashboard/loader.js"></script>
</body>
</html>
