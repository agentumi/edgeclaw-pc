<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace — EdgeClaw</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #050508;
            --bg-secondary: #0a0a0f;
            --bg-tertiary: #12121a;
            --bg-card: #16161f;
            --border-color: #2a2a3a;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-primary: #6366f1;
            --accent-hover: #818cf8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
        }
        .sidebar {
            width: 240px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-primary);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-primary), #8b5cf6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-item {
            padding: 12px 16px;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .nav-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
        .nav-item.active { background: var(--accent-primary); color: white; }
        .nav-icon { width: 20px; text-align: center; }
        .main { flex: 1; display: flex; flex-direction: column; }
        .header {
            padding: 20px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-secondary);
        }
        .header-title { font-size: 24px; font-weight: 600; }
        .content { flex: 1; padding: 30px; overflow-y: auto; }
        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .search-input {
            flex: 1;
            padding: 12px 20px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
        }
        .search-input:focus { outline: none; border-color: var(--accent-primary); }
        .category-filters {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .category-btn {
            padding: 8px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }
        .category-btn:hover, .category-btn.active {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .item-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.2s;
        }
        .item-card:hover { border-color: var(--accent-primary); transform: translateY(-2px); }
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        .item-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .item-price {
            font-size: 18px;
            font-weight: 600;
            color: var(--accent-green);
        }
        .item-price.free { color: var(--accent-primary); }
        .item-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
        .item-desc { color: var(--text-secondary); font-size: 14px; line-height: 1.5; margin-bottom: 16px; }
        .item-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }
        .item-rating { color: var(--accent-yellow); }
        .item-author { font-size: 12px; color: var(--text-muted); }
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            width: 100%;
        }
        .btn-primary { background: var(--accent-primary); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); }
        .btn-installed { background: var(--accent-green); color: white; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="logo">
            <div class="logo-icon">⚡</div>
            EdgeClaw
        </div>
        <div class="nav-item" onclick="navigate('dashboard')">
            <span class="nav-icon">📊</span> Mission Control
        </div>
        <div class="nav-item" onclick="navigate('agents')">
            <span class="nav-icon">🤖</span> Agents
        </div>
        <div class="nav-item" onclick="navigate('memory')">
            <span class="nav-icon">🧠</span> Memory
        </div>
        <div class="nav-item" onclick="navigate('automations')">
            <span class="nav-icon">⚙️</span> Automations
        </div>
        <div class="nav-item active" onclick="navigate('marketplace')">
            <span class="nav-icon">🛒</span> Marketplace
        </div>
        <div class="nav-item" onclick="navigate('settings')">
            <span class="nav-icon">⚙️</span> Settings
        </div>
    </nav>
    
    <main class="main">
        <header class="header">
            <h1 class="header-title">Marketplace</h1>
        </header>
        
        <div class="content">
            <div class="search-bar">
                <input type="text" class="search-input" placeholder="Search agents, automations, plugins..." id="searchInput" oninput="filterItems()">
            </div>
            
            <div class="category-filters" id="categoryFilters">
                <button class="category-btn active" data-category="all" onclick="filterCategory('all')">All</button>
                <button class="category-btn" data-category="agent" onclick="filterCategory('agent')">Agents</button>
                <button class="category-btn" data-category="automation" onclick="filterCategory('automation')">Automations</button>
                <button class="category-btn" data-category="plugin" onclick="filterCategory('plugin')">Plugins</button>
                <button class="category-btn" data-category="template" onclick="filterCategory('template')">Templates</button>
                <button class="category-btn" data-category="integration" onclick="filterCategory('integration')">Integrations</button>
            </div>
            
            <div class="items-grid" id="itemsGrid">
                <!-- Items loaded by JS -->
            </div>
        </div>
    </main>
    
    <script>
        let items = [];
        
        function navigate(page) {
            window.location.href = '/' + page;
        }
        
        function loadItems() {
            // Demo marketplace items
            items = [
                { id: 'mkt001', name: 'Data Analyst Agent', description: 'AI-powered data analysis and visualization agent', category: 'agent', icon: '📊', price: 'Free', rating: 4.8, author: 'EdgeClaw Team', installed: true },
                { id: 'mkt002', name: 'Security Scanner', description: 'Automated security vulnerability scanning', category: 'plugin', icon: '🔒', price: '$29/mo', rating: 4.5, author: 'SecureTech', installed: false },
                { id: 'mkt003', name: 'GitHub Integration', description: 'Seamless GitHub workflow integration', category: 'integration', icon: '🐙', price: 'Free', rating: 4.7, author: 'EdgeClaw Team', installed: true },
                { id: 'mkt004', name: 'Slack Notifier', description: 'Send notifications to Slack channels', category: 'integration', icon: '💬', price: 'Free', rating: 4.6, author: 'Community', installed: false },
                { id: 'mkt005', name: 'Weekly Report Template', description: 'Automated weekly status report generator', category: 'template', icon: '📋', price: 'Free', rating: 4.9, author: 'EdgeClaw Team', installed: true },
                { id: 'mkt006', name: 'Code Review Agent', description: 'Automated code review with AI insights', category: 'agent', icon: '🔍', price: '$19/mo', rating: 4.4, author: 'DevTools Inc', installed: false },
                { id: 'mkt007', name: 'Cloud Deploy Pro', description: 'Advanced multi-cloud deployment automation', category: 'automation', icon: '☁️', price: '$49/mo', rating: 4.3, author: 'CloudScale', installed: false },
                { id: 'mkt008', name: 'SEO Analyzer', description: 'Comprehensive SEO analysis and recommendations', category: 'plugin', icon: '🔎', price: '$15/mo', rating: 4.7, author: 'MarketingPro', installed: false },
            ];
            renderItems();
        }
        
        function renderItems() {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = items.map(item => `
                <div class="item-card">
                    <div class="item-header">
                        <div class="item-icon">${item.icon}</div>
                        <div class="item-price ${item.price === 'Free' ? 'free' : ''}">${item.price}</div>
                    </div>
                    <h3 class="item-title">${item.name}</h3>
                    <p class="item-desc">${item.description}</p>
                    <div class="item-meta">
                        <span class="item-rating">★ ${item.rating}</span>
                        <span class="item-author">by ${item.author}</span>
                    </div>
                    <div style="margin-top: 16px;">
                        <button class="btn ${item.installed ? 'btn-installed' : 'btn-primary'}" onclick="toggleInstall('${item.id}')">
                            ${item.installed ? '✓ Installed' : 'Install'}
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        function filterCategory(category) {
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.category === category);
            });
            filterItems();
        }
        
        function filterItems() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const activeCategory = document.querySelector('.category-btn.active').dataset.category;
            
            const filtered = items.filter(item => {
                const matchSearch = item.name.toLowerCase().includes(search) || item.description.toLowerCase().includes(search);
                const matchCategory = activeCategory === 'all' || item.category === activeCategory;
                return matchSearch && matchCategory;
            });
            
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = filtered.map(item => `
                <div class="item-card">
                    <div class="item-header">
                        <div class="item-icon">${item.icon}</div>
                        <div class="item-price ${item.price === 'Free' ? 'free' : ''}">${item.price}</div>
                    </div>
                    <h3 class="item-title">${item.name}</h3>
                    <p class="item-desc">${item.description}</p>
                    <div class="item-meta">
                        <span class="item-rating">★ ${item.rating}</span>
                        <span class="item-author">by ${item.author}</span>
                    </div>
                    <div style="margin-top: 16px;">
                        <button class="btn ${item.installed ? 'btn-installed' : 'btn-primary'}" onclick="toggleInstall('${item.id}')">
                            ${item.installed ? '✓ Installed' : 'Install'}
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        function toggleInstall(id) {
            const item = items.find(i => i.id === id);
            if (item) {
                item.installed = !item.installed;
                renderItems();
            }
        }
        
        loadItems();
    </script>
</body>
</html>
