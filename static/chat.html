<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdgeClaw AI Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #FFFFFF;
    --bg-sidebar: #F9F9F9;
    --border: #E5E5E5;
    --text-primary: #1A1A1A;
    --text-secondary: #737373;
    --hover-bg: #F3F3F3;
    --accent: #000000;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
    color: var(--text-primary);
    background: var(--bg-main);
  }

  /* Sidebar */
  .sidebar {
    width: 260px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 16px;
    flex-shrink: 0;
  }

  .new-chat-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 10px 14px;
    background: transparent;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
    cursor: pointer;
    text-align: left;
    transition: background 0.2s;
  }

  .new-chat-btn:hover {
    background: var(--hover-bg);
  }

  .history-list {
    flex: 1;
    overflow-y: auto;
    margin-top: 24px;
  }

  .history-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 8px;
    padding-left: 8px;
  }

  .history-item {
    padding: 8px 12px;
    font-size: 13px;
    color: var(--text-primary);
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .history-item:hover { background: var(--hover-bg); }

  .settings-btn {
    margin-top: auto;
    padding: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    color: var(--text-primary);
  }
  .settings-btn:hover { background: var(--hover-bg); }

  /* Main Content */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    background: var(--bg-main);
  }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.3s;
  }

  .empty-logo-wrapper {
    width: 64px; height: 64px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: #FAFAFA;
    border: 1px solid var(--border);
    margin-bottom: 24px;
    font-size: 28px;
    font-weight: 600;
  }

  .empty-state h1 {
    font-size: 28px;
    font-weight: 500;
    color: var(--text-primary);
  }

  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20%;
    display: none;
    flex-direction: column;
    gap: 24px;
  }

  .msg {
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 15px;
    line-height: 1.6;
    animation: fadeIn 0.3s ease;
  }

  .msg.user {
    align-items: flex-end;
  }
  .msg.user .msg-bubble {
    background: #F4F4F4;
    padding: 12px 16px;
    border-radius: 16px;
    max-width: 80%;
  }

  .msg.agent .msg-bubble {
    color: var(--text-primary);
    max-width: 100%;
  }

  .msg-bubble pre {
    background: #F9F9F9;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    overflow-x: auto;
    font-family: monospace;
    font-size: 13px;
    margin: 8px 0;
  }
  
  .exec-result {
    margin-top: 10px;
    padding: 12px;
    border-radius: 8px;
    background: #FAFAFA;
    border: 1px solid var(--border);
    font-family: monospace;
    font-size: 12px;
    color: #333;
    white-space: pre-wrap;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* Input Container */
  .input-container {
    padding: 0 20% 24px;
  }

  .input-box {
    position: relative;
    background: #F4F4F4;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    padding: 12px 16px;
    border: 1px solid transparent;
    transition: border 0.2s;
  }
  .input-box:focus-within {
    border-color: #D4D4D4;
  }

  .process-selector {
    position: absolute;
    top: -40px;
    left: 10px;
    background: transparent;
    border: none;
    font-size: 16px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    outline: none;
  }
  .process-selector:hover { color: var(--text-primary); }

  #chatInput {
    background: transparent;
    border: none;
    resize: none;
    outline: none;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    padding-right: 40px;
    max-height: 200px;
    color: var(--text-primary);
  }
  #chatInput::placeholder { color: #A3A3A3; }

  .send-btn {
    position: absolute;
    right: 12px;
    bottom: 12px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: var(--text-secondary);
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: background 0.2s;
  }
  .send-btn.active {
    background: var(--accent);
  }

  .input-disclaimer {
    text-align: center;
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 12px;
  }

  .typing-indicator {
    display: none;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
  }
  .typing-indicator.active { display: flex; }
  .dot {
    width: 6px; height: 6px;
    background: var(--text-secondary);
    border-radius: 50%;
    animation: blink 1.4s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 100% { opacity: 0.4; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }
  
  /* Responsive */
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .chat-area { padding: 20px 5%; }
    .input-container { padding: 0 5% 20px; }
  }
</style>
</head>
<body>

<div class="sidebar">
  <button class="new-chat-btn" onclick="location.reload()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    New Chat
  </button>
  
  <div class="history-list" id="historyList">
    <div class="history-label">Today</div>
    <!-- History items injected here -->
  </div>

  <div class="settings-btn" onclick="window.location.href='/settings'">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    Settings
  </div>
</div>

<div class="main-content">
  <div class="empty-state" id="emptyState">
    <div class="empty-logo-wrapper">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
    </div>
    <h1>How can I help you?</h1>
  </div>

  <div class="chat-area" id="chatArea">
    <!-- Messages injected here -->
  </div>

  <div class="input-container">
    <select id="processSelector" class="process-selector">
      <option value="Fleet">Fleet V2 ∨</option>
      <option value="Quantum">Quantum V3 ∨</option>
      <option value="Auto">Auto ∨</option>
    </select>
    
    <div class="input-box">
      <textarea id="chatInput" rows="1" placeholder="Message EdgeClaw..." autofocus></textarea>
      <button id="sendBtn" class="send-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
      </button>
    </div>
    
    <div class="typing-indicator" id="typingIndicator">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <span style="font-size:12px; color:var(--text-secondary); margin-left:4px;">Thinking...</span>
    </div>

    <div class="input-disclaimer">
      EdgeClaw AI is autonomous and may execute system actions. Consider verifying outputs.
    </div>
  </div>
</div>

<script>
  const API = window.location.origin;
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const chatArea = document.getElementById('chatArea');
  const emptyState = document.getElementById('emptyState');
  const typingIndicator = document.getElementById('typingIndicator');
  const processSelector = document.getElementById('processSelector');
  const historyList = document.getElementById('historyList');

  let sending = false;

  // Auto-resize input
  chatInput.addEventListener('input', () => {
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 200) + 'px';
    if(chatInput.value.trim().length > 0) {
      sendBtn.classList.add('active');
    } else {
      sendBtn.classList.remove('active');
    }
  });

  chatInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  processSelector.addEventListener('change', async (e) => {
    try {
      await fetch(`${API}/api/v3/process-type`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: e.target.value })
      });
    } catch(err) {
      console.warn("Failed to set process type", err);
    }
  });

  // Load initial process type
  async function loadInitialProcessType() {
    try {
      const resp = await fetch(`${API}/api/v3/process-type`);
      if(resp.ok) {
        const data = await resp.json();
        // data.process_type might be "Fleet", "Quantum", "Auto"
        let pt = data.process_type || "Fleet";
        pt = pt.charAt(0).toUpperCase() + pt.slice(1);
        processSelector.value = pt;
      }
    } catch(e) {}
  }

  // Load simple history
  async function loadHistory() {
    try {
      const res = await fetch(`${API}/api/chat/history`);
      if(res.ok) {
        const data = await res.json();
        const pastReq = data.messages?.filter(m => m.role === 'user').reverse().slice(0, 5) || [];
        if(pastReq.length > 0) {
           emptyState.style.display = 'none';
           chatArea.style.display = 'flex';
           data.messages.forEach(m => {
              addMessageToUI(m.role, m.content, m.meta);
           });
        }
      }
    } catch(e) {}
  }

  function addMessageToUI(role, text, meta) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    
    let content = escapeHtml(text);
    content = content.replace(/```([\s\S]*?)```/g, '<pre>$1</pre>');
    content = content.replace(/`([^`]+)`/g, '<code style="background:#F4F4F4;padding:2px 4px;border-radius:4px;">$1</code>');
    content = content.replace(/\n/g, '<br>');

    let execHtml = '';
    if(meta && meta.exec_result) {
       const color = meta.exec_result.success ? '#10b981' : '#ef4444';
       const icon = meta.exec_result.success ? '?' : '?';
       execHtml = `
         <div class="exec-result" style="border-left: 3px solid ${color}">
            <div style="font-weight:600; margin-bottom:4px; color:${color}">${icon} Executed (Exit: ${meta.exec_result.exit_code})</div>
            ${escapeHtml(meta.exec_result.stdout || meta.exec_result.stderr || '')}
         </div>
       `;
    }

    div.innerHTML = `<div class="msg-bubble">${content}${execHtml}</div>`;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  async function sendMessage() {
    const text = chatInput.value.trim();
    if (!text || sending) return;

    sending = true;
    chatInput.value = '';
    chatInput.style.height = 'auto';
    sendBtn.classList.remove('active');

    if(emptyState.style.display !== 'none') {
       emptyState.style.display = 'none';
       chatArea.style.display = 'flex';
    }

    addMessageToUI('user', text, null);
    typingIndicator.classList.add('active');
    chatArea.scrollTop = chatArea.scrollHeight;

    try {
      const res = await fetch(`${API}/api/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });

      if (!res.ok) {
        throw new Error(await res.text() || `HTTP ${res.status}`);
      }

      const data = await res.json();
      addMessageToUI('agent', data.message, { exec_result: data.exec_result });
      
      // Add to sidebar history
      if(historyList.children.length > 5) {
         historyList.removeChild(historyList.lastChild);
      }
      const item = document.createElement('div');
      item.className = 'history-item';
      item.textContent = text.substring(0, 30);
      historyList.insertBefore(item, historyList.children[1]);

    } catch (err) {
      addMessageToUI('agent', `**System Error:** ${err.message}`, null);
    } finally {
      typingIndicator.classList.remove('active');
      sending = false;
      chatInput.focus();
    }
  }

  // Init
  loadInitialProcessType();
  loadHistory();
</script>
</body>
</html>
