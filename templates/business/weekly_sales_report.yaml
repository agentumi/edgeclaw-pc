# Weekly Sales Report Automation Template
# Business Domain Template

template:
  id: "biz_weekly_sales"
  name: "주간 판매보고서 생성"
  version: "1.0.0"
  domain: "business"
  category: "report"
  description: "주간 판매 데이터를 수집하여 자동 보고서를 생성합니다"
  
  metadata:
    author: "EdgeClaw Team"
    created_at: "2026-01-15"
    updated_at: "2026-03-10"
    usage_count: 1547
    rating: 4.8
    tags: ["sales", "report", "weekly", "analytics"]

variables:
  - name: "report_period"
    type: "enum"
    description: "보고 기간"
    default: "last_week"
    required: true
    options: ["last_week", "this_month", "custom"]
    
  - name: "include_charts"
    type: "boolean"
    description: "차트 포함"
    default: true
    required: false
    
  - name: "recipients"
    type: "array"
    description: "수신자 이메일 목록"
    required: true
    item_type: "email"
    
  - name: "department"
    type: "string"
    description: "부서"
    default: "all"
    required: false

workflow:
  nodes:
    - id: "fetch_sales_data"
      type: "action"
      action: "DatabaseQuery"
      params:
        query: "SELECT * FROM sales WHERE date >= :period_start"
        connection: "erp_db"
      outputs:
        - "sales_data"
        
    - id: "calculate_metrics"
      type: "transform"
      transform: "CalculateSalesMetrics"
      inputs:
        - "sales_data"
      outputs:
        - "metrics"
        
    - id: "generate_charts"
      type: "conditional"
      condition: "{{include_charts}}"
      true_nodes:
        - "create_revenue_chart"
        - "create_growth_chart"
      false_nodes: []
      
    - id: "create_revenue_chart"
      type: "action"
      action: "CreateChart"
      params:
        type: "bar"
        data: "{{metrics.revenue}}"
        title: "주간 매출"
      outputs:
        - "revenue_chart"
        
    - id: "create_growth_chart"
      type: "action"
      action: "CreateChart"
      params:
        type: "line"
        data: "{{metrics.growth_rate}}"
        title: "성장률 추이"
      outputs:
        - "growth_chart"
        
    - id: "compile_report"
      type: "action"
      action: "RenderMarkdown"
      params:
        template: "templates/sales_weekly.md"
        data:
          metrics: "{{metrics}}"
          charts:
            revenue: "{{revenue_chart}}"
            growth: "{{growth_chart}}"
      outputs:
        - "report_file"
        
    - id: "send_notification"
      type: "action"
      action: "SendEmail"
      params:
        to: "{{recipients}}"
        subject: "주간 판매보고서 - {{report_period}}"
        attachment: "{{report_file}}"
        body: "주간 판매보고서를 전송합니다. 확인부탁드립니다."

  edges:
    - from: "fetch_sales_data"
      to: "calculate_metrics"
    - from: "calculate_metrics"
      to: "generate_charts"
    - from: "create_revenue_chart"
      to: "compile_report"
    - from: "create_growth_chart"
      to: "compile_report"
    - from: "compile_report"
      to: "send_notification"

requirements:
  permissions:
    - "database:read"
    - "email:send"
    - "file:write"
  resources:
    cpu: "500m"
    memory: "1Gi"
    timeout_sec: 300

options:
  retry_policy:
    max_attempts: 3
    backoff_ms: 1000
  notification:
    on_start: true
    on_progress: false
    on_complete: true
    on_error: true
