<div id="view-fleet" class="view-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
                <div>
                    <h2 style="font-size:22px; font-weight:700; margin-bottom:4px;"><i class="fa-solid fa-network-wired" style="color:var(--primary-400); margin-right:10px;"></i>Fleet Governance</h2>
                    <p style="font-size:13px; color:var(--text-muted); margin:0;">Organize agents into teams and apply global policies</p>
                </div>
                <div style="display:flex; gap:12px;">
                    <button class="btn" onclick="showCreateGroupModal()"><i class="fa-solid fa-plus"></i> Create Team</button>
                    <button class="btn btn-primary" onclick="syncAllPolicies()"><i class="fa-solid fa-sync"></i> Sync All</button>
                </div>
            </div>

            <div class="group-action-bar">
                <div style="display:flex; align-items:center; gap:12px; flex:1;">
                    <i class="fa-solid fa-shield-halved" style="color:var(--primary-400); font-size:20px;"></i>
                    <div>
                        <div style="font-size:13px; font-weight:600;">Global Policy Enforcement</div>
                        <div style="font-size:11px; color:var(--text-muted);">Active for 4 teams, 12 nodes</div>
                    </div>
                </div>
                <div class="group-capsule synergy-active">
                    <i class="fa-solid fa-sparkles"></i> 89% Synergy
                </div>
                <button class="btn" style="border-radius:20px; font-size:11px;"><i class="fa-solid fa-stop"></i> Stop Fleet</button>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 340px; gap:24px;">
                <div id="fleet-visual-map" class="card" style="padding:0; min-height:450px; position:relative; overflow:hidden;">
                    <div style="padding:16px; border-bottom:1px solid var(--surface-700); display:flex; justify-content:space-between; align-items:center; position:absolute; top:0; left:0; right:0; z-index:5; background:rgba(18, 18, 26, 0.8); backdrop-filter:blur(8px);">
                        <span style="font-size:12px; font-weight:600;"><i class="fa-solid fa-map" style="margin-right:8px;"></i>Visual Fleet Map</span>
                        <div style="display:flex; gap:10px;">
                            <span class="badge badge-blue">V2.3 Active</span>
                        </div>
                    </div>
                    <canvas id="fleetGraphCanvas" width="800" height="450" style="width:100%; height:450px; cursor:crosshair;"></canvas>
                </div>

                <div class="card" style="padding:20px;">
                    <h3 style="font-size:15px; font-weight:600; margin-bottom:16px;"><i class="fa-solid fa-users" style="color:var(--primary-400); margin-right:8px;"></i>Team Directory</h3>
                    <div id="fleetTeamList" style="display:flex; flex-direction:column; gap:12px;">
                        <!-- Populated by JS -->
                    </div>

                    <div class="card" style="margin-top:20px; background:rgba(30, 30, 46, 0.5); border-color:var(--accent-purple);">
                        <h3 style="font-size:14px; font-weight:600; margin-bottom:12px; color:var(--accent-purple);"><i class="fa-solid fa-brain" style="margin-right:8px;"></i>Shared Memory</h3>
                        <div style="display:flex; flex-direction:column; gap:10px; font-size:12px;">
                            <div style="display:flex; justify-content:space-between;">
                                <span style="color:var(--text-muted);">Sync Points</span>
                                <span style="font-weight:700;">842 nodes</span>
                            </div>
                            <div style="display:flex; justify-content:space-between;">
                                <span style="color:var(--text-muted);">Group Knowledge</span>
                                <span style="font-weight:700; color:var(--accent-green);">Optimized</span>
                            </div>
                            <div style="height:4px; background:var(--surface-700); border-radius:2px; margin-top:4px;">
                                <div style="width:75%; height:100%; background:var(--accent-purple); border-radius:2px; box-shadow:0 0 10px var(--accent-purple);"></div>
                            </div>
                            <button class="btn" style="width:100%; font-size:11px; margin-top:6px;"><i class="fa-solid fa-microchip"></i> Diff Sync</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
