<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdgeClaw — Activity Feed</title>
<style>
:root { --bg: #1a1a2e; --surface: #16213e; --card: #0f3460; --accent: #e94560; --text: #eee; --muted: #999; --border: #2a2a4a; --success: #4ade80; --warn: #fbbf24; }
[data-theme="light"] { --bg: #f5f5f5; --surface: #fff; --card: #e8e8e8; --accent: #e94560; --text: #222; --muted: #666; --border: #ddd; --success: #16a34a; --warn: #d97706; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
nav .logo { font-weight: 700; font-size: 1.1rem; color: var(--accent); }
nav .links a { color: var(--muted); text-decoration: none; margin-left: 1rem; font-size: 0.9rem; }
nav .links a:hover, nav .links a.active { color: var(--accent); }
.theme-toggle { cursor: pointer; background: none; border: 1px solid var(--border); color: var(--text); padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.8rem; }
.container { max-width: 900px; margin: 0 auto; padding: 1rem; }
.status-bar { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
.status-pill { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 0.4rem 0.8rem; font-size: 0.8rem; }
.status-pill.connected { border-color: var(--success); color: var(--success); }
.status-pill.disconnected { border-color: var(--accent); color: var(--accent); }
.filters { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem; margin-bottom: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
.filters input, .filters select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 0.4rem 0.6rem; font-size: 0.85rem; }
.filters button { background: var(--accent); color: #fff; border: none; border-radius: 4px; padding: 0.4rem 0.8rem; cursor: pointer; font-size: 0.85rem; }
.entry { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 0.5rem; animation: fadeIn 0.3s ease; }
.entry.new { border-left: 3px solid var(--accent); }
.entry-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.3rem; }
.entry-type { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; background: var(--card); }
.entry-time { font-size: 0.75rem; color: var(--muted); }
.entry-content { font-size: 0.9rem; line-height: 1.4; }
.entry-meta { display: flex; gap: 0.5rem; margin-top: 0.3rem; flex-wrap: wrap; }
.tag { font-size: 0.7rem; background: var(--card); border-radius: 3px; padding: 1px 5px; color: var(--muted); }
.importance-1 { border-left: 3px solid var(--muted); }
.importance-2 { border-left: 3px solid var(--warn); }
.importance-3 { border-left: 3px solid var(--accent); }
.load-more { text-align: center; padding: 1rem; }
.load-more button { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 0.5rem 1.5rem; border-radius: 4px; cursor: pointer; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
@media (max-width: 600px) { .container { padding: 0.5rem; } .filters { flex-direction: column; } }
</style>
</head>
<body>
<nav>
  <span class="logo">🔷 EdgeClaw</span>
  <div class="links">
    <a href="/">Chat</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/activity" class="active">Activity</a>
    <a href="/sessions">Sessions</a>
    <a href="/search">Search</a>
    <a href="/stats">Stats</a>
  </div>
  <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
</nav>
<div class="container">
  <div class="status-bar">
    <span id="ws-status" class="status-pill disconnected">● Disconnected</span>
    <span id="entry-count" class="status-pill">0 entries</span>
  </div>
  <div class="filters">
    <input id="f-project" placeholder="Project" size="12">
    <input id="f-agent" placeholder="Agent ID" size="12">
    <select id="f-importance"><option value="0">All importance</option><option value="1">≥1 Normal</option><option value="2">≥2 Important</option><option value="3">≥3 Critical</option></select>
    <button onclick="applyFilter()">Subscribe</button>
  </div>
  <div id="feed"></div>
  <div class="load-more"><button onclick="loadMore()">Load older…</button></div>
</div>
<script>
let ws, offset = 0, limit = 50;
const feed = document.getElementById('feed');

function toggleTheme() {
  const t = document.documentElement.dataset.theme;
  document.documentElement.dataset.theme = t === 'dark' ? 'light' : 'dark';
}

function connectWS() {
  const loc = location;
  const wsPort = parseInt(loc.port) + 1;
  const wsUrl = `ws://${loc.hostname}:${wsPort}`;
  ws = new WebSocket(wsUrl);
  ws.onopen = () => {
    document.getElementById('ws-status').className = 'status-pill connected';
    document.getElementById('ws-status').textContent = '● Connected';
  };
  ws.onclose = () => {
    document.getElementById('ws-status').className = 'status-pill disconnected';
    document.getElementById('ws-status').textContent = '● Disconnected';
    setTimeout(connectWS, 3000);
  };
  ws.onmessage = (e) => {
    try {
      const evt = JSON.parse(e.data);
      if (evt.type === 'ActivityRecorded' && evt.data) {
        const entry = JSON.parse(evt.data.entry_json || '{}');
        prependEntry(entry, true);
      }
    } catch(_) {}
  };
}

function applyFilter() {
  if (!ws || ws.readyState !== 1) return;
  const sub = {
    subscribe: {
      project: document.getElementById('f-project').value,
      agent: document.getElementById('f-agent').value,
      min_importance: parseInt(document.getElementById('f-importance').value) || 0
    }
  };
  ws.send(JSON.stringify(sub));
}

function prependEntry(e, isNew) {
  if (!e || !e.id) return;
  const div = document.createElement('div');
  const imp = e.importance || 0;
  div.className = `entry importance-${imp}${isNew ? ' new' : ''}`;
  const type = e.activity_type?.type || 'unknown';
  const time = e.timestamp ? new Date(e.timestamp).toLocaleTimeString() : '';
  const tags = (e.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
  div.innerHTML = `
    <div class="entry-header">
      <span class="entry-type">${type}</span>
      <span class="entry-time">${time} | ${e.project || ''} | ${e.agent_name || ''}</span>
    </div>
    <div class="entry-content">${e.content || ''}</div>
    <div class="entry-meta">${tags}<span class="tag">imp:${imp}</span></div>`;
  if (isNew) feed.prepend(div); else feed.append(div);
}

async function loadMore() {
  try {
    const imp = document.getElementById('f-importance').value;
    const proj = document.getElementById('f-project').value;
    let url = `/api/activities?offset=${offset}&limit=${limit}`;
    if (imp > 0) url += `&importance=${imp}`;
    if (proj) url += `&project=${encodeURIComponent(proj)}`;
    const res = await fetch(url);
    const data = await res.json();
    (data.entries || []).forEach(e => prependEntry(e, false));
    offset += data.entries?.length || 0;
    document.getElementById('entry-count').textContent = `${data.total || 0} entries`;
  } catch(e) { console.error(e); }
}

loadMore();
connectWS();
</script>
</body>
</html>
