<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdgeClaw — Session Detail</title>
<style>
:root { --bg: #1a1a2e; --surface: #16213e; --card: #0f3460; --accent: #e94560; --text: #eee; --muted: #999; --border: #2a2a4a; --success: #4ade80; --warn: #fbbf24; }
[data-theme="light"] { --bg: #f5f5f5; --surface: #fff; --card: #e8e8e8; --accent: #e94560; --text: #222; --muted: #666; --border: #ddd; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
nav .logo { font-weight: 700; font-size: 1.1rem; color: var(--accent); }
nav .links a { color: var(--muted); text-decoration: none; margin-left: 1rem; font-size: 0.9rem; }
nav .links a:hover { color: var(--accent); }
.theme-toggle { cursor: pointer; background: none; border: 1px solid var(--border); color: var(--text); padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.8rem; }
.container { max-width: 1000px; margin: 0 auto; padding: 1rem; }
h1 { font-size: 1.3rem; margin-bottom: 0.3rem; }
.subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.metric { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; text-align: center; }
.metric .value { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
.metric .label { font-size: 0.8rem; color: var(--muted); }
.section { margin-bottom: 1.5rem; }
.section h2 { font-size: 1.1rem; margin-bottom: 0.75rem; border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }
.file-list { list-style: none; }
.file-list li { padding: 0.4rem 0.6rem; font-family: monospace; font-size: 0.85rem; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; margin-bottom: 0.3rem; }
.timeline-entry { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0.6rem 0.8rem; margin-bottom: 0.4rem; font-size: 0.85rem; }
.timeline-entry .te-time { font-size: 0.75rem; color: var(--muted); }
.timeline-entry .te-type { font-weight: 600; text-transform: uppercase; font-size: 0.7rem; margin-right: 0.5rem; }
.chart-container { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
.bar { display: flex; align-items: center; margin-bottom: 0.3rem; }
.bar-label { width: 80px; font-size: 0.8rem; color: var(--muted); }
.bar-fill { height: 20px; background: var(--accent); border-radius: 3px; min-width: 2px; transition: width 0.5s; }
.bar-value { margin-left: 0.5rem; font-size: 0.8rem; }
.context-box { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; font-size: 0.85rem; white-space: pre-wrap; color: var(--muted); max-height: 300px; overflow-y: auto; }
@media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<nav>
  <span class="logo">🔷 EdgeClaw</span>
  <div class="links">
    <a href="/">Chat</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/activity">Activity</a>
    <a href="/sessions">Sessions</a>
    <a href="/search">Search</a>
    <a href="/stats">Stats</a>
  </div>
  <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
</nav>
<div class="container">
  <h1 id="session-title">Session Detail</h1>
  <div class="subtitle" id="session-sub"></div>
  <div class="grid" id="metrics"></div>

  <div class="section">
    <h2>Token Usage</h2>
    <div class="chart-container" id="token-chart"></div>
  </div>

  <div class="section">
    <h2>Files Modified</h2>
    <ul class="file-list" id="files"></ul>
  </div>

  <div class="section">
    <h2>Context Injection</h2>
    <div class="context-box" id="context"></div>
  </div>

  <div class="section">
    <h2>Timeline</h2>
    <div id="timeline"></div>
  </div>
</div>
<script>
function toggleTheme() { const t = document.documentElement.dataset.theme; document.documentElement.dataset.theme = t === 'dark' ? 'light' : 'dark'; }

const sid = location.pathname.split('/').pop();

async function load() {
  try {
    const [detailRes, timelineRes, contextRes] = await Promise.all([
      fetch(`/api/sessions/${sid}`),
      fetch(`/api/sessions/${sid}/timeline`),
      fetch(`/api/sessions/${sid}/context`),
    ]);
    const detail = await detailRes.json();
    const timeline = await timelineRes.json();
    const context = await contextRes.json();

    const s = detail.session || {};
    document.getElementById('session-title').textContent = `${s.agent_name || ''} — ${s.project || ''}`;
    const status = (s.status || 'unknown');
    const started = s.started_at ? new Date(s.started_at).toLocaleString() : '';
    const ended = s.ended_at ? new Date(s.ended_at).toLocaleString() : 'ongoing';
    document.getElementById('session-sub').textContent = `${status} | ${started} → ${ended} | ${detail.entry_count || 0} entries`;

    // Metrics
    const metricsDiv = document.getElementById('metrics');
    const metrics = [
      { v: `$${(s.total_cost_usd || 0).toFixed(4)}`, l: 'Cost' },
      { v: (s.total_input_tokens || 0).toLocaleString(), l: 'Input Tokens' },
      { v: (s.total_output_tokens || 0).toLocaleString(), l: 'Output Tokens' },
      { v: s.turns || 0, l: 'Turns' },
      { v: (s.files_modified || []).length, l: 'Files Changed' },
      { v: s.error_count || 0, l: 'Errors' },
    ];
    metricsDiv.innerHTML = metrics.map(m => `<div class="metric"><div class="value">${m.v}</div><div class="label">${m.l}</div></div>`).join('');

    // Token chart
    const totalTok = (s.total_input_tokens || 0) + (s.total_output_tokens || 0);
    const chartDiv = document.getElementById('token-chart');
    if (totalTok > 0) {
      const inPct = ((s.total_input_tokens / totalTok) * 100).toFixed(1);
      const outPct = ((s.total_output_tokens / totalTok) * 100).toFixed(1);
      chartDiv.innerHTML = `
        <div class="bar"><span class="bar-label">Input</span><div class="bar-fill" style="width:${inPct}%"></div><span class="bar-value">${s.total_input_tokens?.toLocaleString()} (${inPct}%)</span></div>
        <div class="bar"><span class="bar-label">Output</span><div class="bar-fill" style="width:${outPct}%;background:var(--warn)"></div><span class="bar-value">${s.total_output_tokens?.toLocaleString()} (${outPct}%)</span></div>`;
    } else {
      chartDiv.textContent = 'No token data';
    }

    // Files
    const filesUl = document.getElementById('files');
    filesUl.innerHTML = (s.files_modified || []).map(f => `<li>📄 ${f}</li>`).join('') || '<li>No files modified</li>';

    // Context
    document.getElementById('context').textContent = JSON.stringify(context.context || {}, null, 2);

    // Timeline
    const tlDiv = document.getElementById('timeline');
    (timeline.entries || []).forEach(e => {
      const div = document.createElement('div');
      div.className = 'timeline-entry';
      const time = e.timestamp ? new Date(e.timestamp).toLocaleTimeString() : '';
      const type = e.activity_type?.type || 'unknown';
      div.innerHTML = `<span class="te-type">${type}</span><span class="te-time">${time}</span><br>${e.content || ''}`;
      tlDiv.appendChild(div);
    });
    if ((timeline.entries || []).length === 0) tlDiv.innerHTML = '<p style="color:var(--muted)">No timeline entries</p>';

  } catch(e) { console.error(e); document.getElementById('session-title').textContent = 'Session not found'; }
}

load();
</script>
</body>
</html>
