<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdgeClaw AI Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- font awesome -->
<script src="https://kit.fontawesome.com/e8a97f7b71.js" crossorigin="anonymous"></script>
<style>
  :root {
    --bg-main: #FFFFFF;
    --bg-sidebar: #F9F9F9;
    --border: #E5E5E5;
    --text-primary: #2D2D2D;
    --text-secondary: #4A4A4A;
    --hover-bg: #F0F0F0;
    --accent: #000000;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
    color: var(--text-primary);
    background: var(--bg-main);
  }

  /* Sidebar */
  .sidebar {
    width: 260px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .sidebar-header {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .btn-sidebar {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 14px;
    background: transparent;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
    cursor: pointer;
    text-align: left;
    transition: background 0.2s;
  }

  .btn-sidebar:hover {
    background: var(--hover-bg);
  }

  .history-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .history-group {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .history-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 6px;
    padding-left: 10px;
  }

  .history-item {
    padding: 10px 12px;
    font-size: 13px;
    color: var(--text-primary);
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .history-item:hover { background: var(--hover-bg); }

  .sidebar-footer {
    padding: 16px;
    border-top: 1px solid var(--border);
  }

  /* Main Content */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    background: var(--bg-main);
  }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.3s;
  }

  .empty-logo-wrapper {
    width: 64px; height: 64px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: #FAFAFA;
    border: 1px solid var(--border);
    margin-bottom: 24px;
    font-size: 28px;
    font-weight: 600;
    color: #4A4A4A;
  }

  .empty-state h1 {
    font-size: 24px;
    font-weight: 500;
    color: var(--text-primary);
  }

  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px 10%;
    display: none;
    flex-direction: column;
    gap: 24px;
    scroll-behavior: smooth;
  }

  .msg {
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 15px;
    line-height: 1.6;
    animation: fadeIn 0.3s ease;
    max-width: 800px;
    margin: 0 auto;
    width: 100%;
  }

  .msg.user {
    align-items: flex-end;
  }
  .msg.user .msg-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 4px;
    align-self: flex-end;
  }
  .msg.user .msg-bubble {
    background: #F4F4F4;
    padding: 12px 18px;
    border-radius: 18px;
    max-width: 80%;
  }

  .msg.agent .msg-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  
  .msg.agent .msg-bubble {
    color: var(--text-primary);
    max-width: 100%;
  }

  .msg-bubble pre {
    background: #F9F9F9;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    overflow-x: auto;
    font-family: monospace;
    font-size: 13px;
    margin: 8px 0;
  }
  
  .checklist {
    list-style: none;
    padding: 0;
    margin: 8px 0;
    font-size: 14px;
  }
  .checklist li {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .checklist li i {
    color: #10b981;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* Input Container */
  .input-container {
    padding: 0 10% 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .input-wrapper {
    position: relative;
    width: 100%;
    max-width: 800px;
    background: #F4F4F4;
    border-radius: 20px;
    display: flex;
    align-items: flex-end;
    padding: 10px 14px;
    border: 1px solid transparent;
    transition: border 0.2s;
  }
  .input-wrapper:focus-within {
    border-color: #D4D4D4;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }

  .attach-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .attach-btn:hover { color: var(--text-primary); background: rgba(0,0,0,0.05); }

  #chatInput {
    flex: 1;
    background: transparent;
    border: none;
    resize: none;
    outline: none;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    padding: 8px 12px;
    max-height: 200px;
    color: var(--text-primary);
  }
  #chatInput::placeholder { color: #A3A3A3; }

  .input-actions-right {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 2px;
  }

  .process-selector {
    background: transparent;
    border: none;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    outline: none;
    padding: 6px;
    border-radius: 6px;
  }
  .process-selector:hover { color: var(--text-primary); background: rgba(0,0,0,0.05); }

  .send-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: var(--text-secondary);
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: background 0.2s, transform 0.1s;
    opacity: 0.5;
  }
  .send-btn.active {
    background: var(--accent);
    opacity: 1;
  }
  .send-btn.active:active { transform: scale(0.95); }

  .input-disclaimer {
    text-align: center;
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 12px;
  }

  .typing-indicator {
    display: none;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
  }
  .typing-indicator.active { display: flex; }
  .dot {
    width: 6px; height: 6px;
    background: var(--text-secondary);
    border-radius: 50%;
    animation: blink 1.4s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 100% { opacity: 0.4; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }
  
  /* Responsive */
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .chat-area { padding: 20px 5%; }
    .input-container { padding: 0 5% 20px; }
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <button class="btn-sidebar" onclick="location.reload()">
      <i class="fa-regular fa-pen-to-square"></i> New Chat
    </button>
  </div>
  
  <div class="history-list" id="historyList">
    <div class="history-group">
        <div class="history-label">This week</div>
        <!-- Items injected -->
    </div>
    <div class="history-group" id="olderHistoryGroup">
        <div class="history-label">Older</div>
    </div>
  </div>

  <div class="sidebar-footer">
    <button class="btn-sidebar" onclick="window.location.href='/settings'">
      <i class="fa-solid fa-gear"></i> Settings
    </button>
  </div>
</div>

<div class="main-content">
  <div class="empty-state" id="emptyState">
    <div class="empty-logo-wrapper">
      <i class="fa-solid fa-robot"></i>
    </div>
    <h1>How can I help you today?</h1>
  </div>

  <div class="chat-area" id="chatArea">
    <!-- Messages injected here -->
  </div>

  <div class="input-container">
    <div class="input-wrapper">
      <button class="attach-btn" title="Attach file">
        <i class="fa-solid fa-plus"></i>
      </button>
      
      <textarea id="chatInput" rows="1" placeholder="Ask EdgeClaw or instruct a mission..." autofocus></textarea>
      
      <div class="input-actions-right">
        <select id="processSelector" class="process-selector">
          <option value="Fleet">Fleet V2 ∨</option>
          <option value="Quantum">Quantum V3 ∨</option>
        </select>
        <button id="sendBtn" class="send-btn">
          <i class="fa-solid fa-arrow-up"></i>
        </button>
      </div>
    </div>
    
    <div class="typing-indicator" id="typingIndicator">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <span style="font-size:12px; color:var(--text-secondary); margin-left:4px;">Agent is thinking...</span>
    </div>

    <div class="input-disclaimer">
      EdgeClaw AI can make mistakes. Verify important orchestrations.
    </div>
  </div>
</div>

<script>
  const API = window.location.origin;
  const isTauri = window.__TAURI__ !== undefined;
  
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const chatArea = document.getElementById('chatArea');
  const emptyState = document.getElementById('emptyState');
  const typingIndicator = document.getElementById('typingIndicator');
  const processSelector = document.getElementById('processSelector');
  const historyList = document.querySelector('#historyList .history-group');

  let sending = false;

  // Auto-resize textarea
  chatInput.addEventListener('input', () => {
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 200) + 'px';
    if(chatInput.value.trim().length > 0) {
      sendBtn.classList.add('active');
    } else {
      sendBtn.classList.remove('active');
    }
  });

  chatInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  // Tauri backend sync logic
  async function loadHistory() {
    try {
      if (isTauri) {
        const { invoke } = window.__TAURI__.tauri;
        const history = await invoke('get_history', {});
        renderHistoryList(history);
      } else {
        const res = await fetch(`${API}/api/chat/history`);
        if(res.ok) {
          const data = await res.json();
          renderHistoryList(data.messages || []);
        }
      }
    } catch(e) {
      console.warn("History load failed", e);
    }
  }

  function renderHistoryList(messages) {
    const pastReq = messages.filter(m => m.role === 'user').reverse().slice(0, 7);
    pastReq.forEach(m => {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.textContent = (m.content || "").substring(0, 30);
        historyList.appendChild(item);
    });
  }

  function addMessageToUI(role, text) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    
    let content = escapeHtml(text || "");
    content = content.replace(/```([\s\S]*?)```/g, '<pre>$1</pre>');
    content = content.replace(/`([^`]+)`/g, '<code style="background:#F4F4F4;padding:2px 4px;border-radius:4px;">$1</code>');
    content = content.replace(/\n/g, '<br>');

    // Checklist mocking example detection
    if(content.includes('[x]') || content.includes('[ ]')) {
        content = content.replace(/\[x\]\s*(.*?)<br>/g, '<ul class="checklist"><li><i class="fa-solid fa-circle-check"></i> $1</li></ul>');
        content = content.replace(/\[ \]\s*(.*?)<br>/g, '<ul class="checklist"><li><i class="fa-regular fa-circle"></i> $1</li></ul>');
    }

    if (role === 'user') {
      div.innerHTML = `
        <div class="msg-label">YOU</div>
        <div class="msg-bubble">${content}</div>
      `;
    } else {
      div.innerHTML = `
        <div class="msg-label"><i class="fa-solid fa-robot"></i> EDGECLAW</div>
        <div class="msg-bubble">${content}</div>
      `;
    }
    
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  async function sendMessage() {
    const text = chatInput.value.trim();
    if (!text || sending) return;

    sending = true;
    chatInput.value = '';
    chatInput.style.height = 'auto';
    sendBtn.classList.remove('active');

    if(emptyState.style.display !== 'none') {
       emptyState.style.display = 'none';
       chatArea.style.display = 'flex';
    }

    addMessageToUI('user', text);
    typingIndicator.classList.add('active');
    chatArea.scrollTop = chatArea.scrollHeight;

    const engineType = processSelector.value;

    try {
      if (isTauri) {
        const { invoke, listen } = window.__TAURI__.tauri;
        
        // Listen for streaming
        const unlisten = await listen('chat_stream', (event) => {
            // handle streaming token here theoretically
        });

        const reply = await invoke('send_prompt', { 
            message: text,
            processType: engineType 
        });
        
        typingIndicator.classList.remove('active');
        addMessageToUI('agent', reply.message);
        unlisten();
      } else {
        // Fallback to HTTP API
        const res = await fetch(`${API}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, process_type: engineType }),
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        
        typingIndicator.classList.remove('active');
        addMessageToUI('agent', data.message);
      }
      
      const item = document.createElement('div');
      item.className = 'history-item';
      item.textContent = text.substring(0, 30);
      historyList.insertBefore(item, historyList.children[1] || null);

    } catch (err) {
      typingIndicator.classList.remove('active');
      addMessageToUI('agent', `**System Error:** ${err.message}`);
    } finally {
      sending = false;
      chatInput.focus();
    }
  }

  // Init
  loadHistory();
</script>
</body>
</html>
