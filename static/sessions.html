<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdgeClaw Sessions</title>
<style>
:root { --bg: #1a1a2e; --surface: #16213e; --card: #0f3460; --accent: #e94560; --text: #eee; --muted: #999; --border: #2a2a4a; --success: #4ade80; --warn: #fbbf24; }
[data-theme="light"] { --bg: #f5f5f5; --surface: #fff; --card: #e8e8e8; --accent: #e94560; --text: #222; --muted: #666; --border: #ddd; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
nav .logo { font-weight: 700; font-size: 1.1rem; color: var(--accent); }
nav .links a { color: var(--muted); text-decoration: none; margin-left: 1rem; font-size: 0.9rem; }
nav .links a:hover, nav .links a.active { color: var(--accent); }
.theme-toggle { cursor: pointer; background: none; border: 1px solid var(--border); color: var(--text); padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.8rem; }
.container { max-width: 1000px; margin: 0 auto; padding: 1rem; }
h1 { font-size: 1.3rem; margin-bottom: 1rem; }
.summary-bar { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
.summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; flex: 1; min-width: 150px; text-align: center; }
.summary-card .value { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
.summary-card .label { font-size: 0.8rem; color: var(--muted); margin-top: 0.3rem; }
.session-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; cursor: pointer; transition: border-color 0.2s; }
.session-card:hover { border-color: var(--accent); }
.session-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
.session-agent { font-weight: 600; }
.session-status { font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; }
.session-status.active { background: var(--success); color: #000; }
.session-status.completed { background: var(--card); color: var(--muted); }
.session-meta { display: flex; gap: 1.5rem; font-size: 0.85rem; color: var(--muted); flex-wrap: wrap; }
.session-summary { font-size: 0.85rem; margin-top: 0.5rem; color: var(--muted); }
.pagination { display: flex; justify-content: center; gap: 0.5rem; margin-top: 1rem; }
.pagination button { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; }
.pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
@media (max-width: 600px) { .summary-bar { flex-direction: column; } .session-meta { flex-direction: column; gap: 0.3rem; } }
</style>
</head>
<body>
<nav>
  <span class="logo">🛡️ EdgeClaw</span>
  <div class="links">
    <a href="/">Chat</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/activity">Activity</a>
    <a href="/sessions" class="active">Sessions</a>
    <a href="/search">Search</a>
    <a href="/stats">Stats</a>
  </div>
  <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
</nav>
<div class="container">
  <h1>Agent Sessions</h1>
  <div class="summary-bar">
    <div class="summary-card"><div class="value" id="total-sessions">-</div><div class="label">Total Sessions</div></div>
    <div class="summary-card"><div class="value" id="total-cost">-</div><div class="label">Total Cost (USD)</div></div>
    <div class="summary-card"><div class="value" id="total-tokens">-</div><div class="label">Total Tokens</div></div>
  </div>
  <div id="sessions-list"></div>
  <div class="pagination">
    <button id="prev-btn" disabled onclick="prevPage()">⏮️ Prev</button>
    <span id="page-info" style="line-height:2.2;font-size:0.85rem;color:var(--muted)"></span>
    <button id="next-btn" disabled onclick="nextPage()">Next ⏭️</button>
  </div>
</div>
<script>
let offset = 0, limit = 20, total = 0;
function toggleTheme() { const t = document.documentElement.dataset.theme; document.documentElement.dataset.theme = t === 'dark' ? 'light' : 'dark'; }

async function loadSessions() {
  try {
    const res = await fetch(`/api/sessions?offset=${offset}&limit=${limit}`);
    const data = await res.json();
    total = data.total || 0;
    document.getElementById('total-sessions').textContent = total;
    document.getElementById('total-cost').textContent = `$${(data.total_cost_usd || 0).toFixed(2)}`;
    document.getElementById('total-tokens').textContent = (data.total_tokens || 0).toLocaleString();
    const list = document.getElementById('sessions-list');
    list.innerHTML = '';
    (data.sessions || []).forEach(s => {
      const card = document.createElement('div');
      card.className = 'session-card';
      card.onclick = () => location.href = `/session/${s.id}`;
      const status = (s.status || 'unknown').toLowerCase();
      const started = s.started_at ? new Date(s.started_at).toLocaleString() : '';
      const ended = s.ended_at ? new Date(s.ended_at).toLocaleString() : 'ongoing';
      card.innerHTML = `
        <div class="session-header">
          <span class="session-agent">${s.agent_name || s.agent_id || ''} ${s.project || ''}</span>
          <span class="session-status ${status}">${status}</span>
        </div>
        <div class="session-meta">
          <span>📅 ${started}</span>
          <span>🕒 ${ended}</span>
          <span>💰 $${(s.total_cost_usd || 0).toFixed(4)}</span>
          <span>🪙 ${((s.total_input_tokens || 0) + (s.total_output_tokens || 0)).toLocaleString()} tokens</span>
          <span>💬 ${s.turns || 0} turns</span>
          <span>📁 ${(s.files_modified || []).length} files</span>
        </div>
        ${s.summary ? '<div class="session-summary">' + s.summary + '</div>' : ''}`;
      list.appendChild(card);
    });
    document.getElementById('page-info').textContent = (offset+1) + " - " + Math.min(offset+limit,total) + " of " + total;
    document.getElementById('prev-btn').disabled = offset === 0;
    document.getElementById('next-btn').disabled = offset + limit >= total;
  } catch(e) { console.error(e); }
}

function nextPage() { offset += limit; loadSessions(); }
function prevPage() { offset = Math.max(0, offset - limit); loadSessions(); }
loadSessions();
</script>
</body>
</html>
